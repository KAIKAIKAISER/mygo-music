name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.33"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
            if [ -f release-notes.md ]; then
              gh release edit "$TAG" --notes-file release-notes.md
            fi
          else
            echo "Creating new release $TAG..."
            if [ -f release-notes.md ]; then
              gh release create "$TAG" release_assets/* \
                --title "MyGo Music $TAG (Windows)" \
                --notes-file release-notes.md
            else
              gh release create "$TAG" release_assets/* \
                --title "MyGo Music $TAG (Windows)" \
                --generate-notes
            fi
          fi

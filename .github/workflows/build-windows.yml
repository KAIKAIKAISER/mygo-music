name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.32"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          NOTES="### 紧急修复与改进 (Critical Fixes & Improvements)
          - **彻底修复点击歌曲下载后界面直接卡死锁死的问题 (Fix Deadlock on Song Download)**:
            - **死锁根因**：\`downloadManager.Queue\` 在持有排他互斥写锁 (\`dm.mu.Lock\`) 状态下，直接调用了试图获取共享读锁 (\`dm.mu.RLock\`) 的持久化方法 \`save()\`。由于 Go 语言标准库 \`sync.RWMutex\` 不支持锁重入，导致主 UI 线程当场死锁挂死。
            - **锁机制重构**：将所有锁内操作规范为非阻塞的 \`saveLocked()\`，并在后台独立 goroutine 中异步完成 JSON 序列化与文件落盘，彻底解决死锁问题。
            - **主线程非阻塞入队**：右键菜单触发下载改为异步后台入队，不阻塞原生主事件循环。
            - **下载写入与取消容错**：优化进度汇报与取消机制，取消任务时实时中断网络传输；优化 Windows 平台下临时分块文件 (\`*.part\`) 创建与目标文件重命名覆盖机制。
          - **全新下载管理中心 (Download Management)**:
            - 侧边栏常驻入口与实时下载任务数量动态徽标。
            - 双标签页管理（【已下载】与【正在下载】），支持播放、在系统文件管理器中快速定位、批量取消与重试。
            - 自动下载并保存伴随本地歌词 (\`.lrc\`)，实现原生完全脱网离线畅听。

          ### 包含文件 (Files)
          - \`mygo-music-setup-0.1.32-amd64.exe\`: Windows 官方风格安装程序 (NSIS Installer)
          - \`MyGo.Music.exe\`: Windows 64位独立便携版 (绿色免安装)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "MyGo Music $TAG (Windows)" \
              --notes "$NOTES"
          fi

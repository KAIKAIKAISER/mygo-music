name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.22"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          NOTES="### 自定义功能特性 (Custom Features)
          - **歌单中歌名搜索 (Search in Playlist)**:
            - 歌单详情页（Playlist）与我喜欢的音乐（Liked Songs）右上方新增搜索框。
            - 实时根据歌曲名、歌手名过滤歌曲列表，支持直接播放过滤结果。
          - **歌词字体大小调节 (Adjustable Lyrics Font Size)**:
            - 设置 (Settings) -> 播放 (Playback) 中新增【歌词字体大小】选项。
            - 提供「小 (24px)」、「标准 (30px)」、「大 (36px)」、「特大 (42px)」四档，支持配置持久化。
            - 逐字歌词、单行滚动歌词及翻译文本同步缩放。

          ### 包含文件 (Files)
          - \`mygo-music-setup-0.1.22-amd64.exe\`: Windows 官方风格安装程序 (NSIS Installer)
          - \`MyGo.Music.exe\`: Windows 64位独立便携版 (绿色免安装)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "MyGo Music $TAG (Windows)" \
              --notes "$NOTES"
          fi

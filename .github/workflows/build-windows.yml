name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.25"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          NOTES="### 修复与更新特性 (Bug Fixes & Features)
          - **全新仿网易云风格桌面歌词 (Desktop Lyrics)**:
            - 悬浮半透明、无边框置顶桌面歌词窗口，支持平滑拖拽移动，位置自动记忆保存。
            - 经典双行歌词展示（当前行高亮 + 下一行预告/逐行翻译），支持卡拉OK逐字精准高亮动画。
            - 悬浮控制浮岛：鼠标悬停即浮现控制栏，提供【上一首/播放/下一首】切歌控制、【网易金/极光青/活力红/清新绿/梦幻粉/纯净白】主题色实时轮换、【字号调节】、【字体轮换】以及【锁定】与【关闭】操作。
            - 深度鼠标穿透锁定：点击锁定后，歌词窗口启用完全鼠标穿透，不遮挡日常办公、浏览器或全屏游戏操作；可通过底部播放栏歌词图标、快捷键 Ctrl+Shift+L、系统托盘右键菜单或设置中心一键解锁。
            - 字体深度自适应：默认字体与客户端保持高度一致，亦可在设置或快捷工具中自由切换微软雅黑、苹方、黑体、楷体、宋体等。
          - **本地音乐自动在线匹配网易云封面与歌词 (Local Music NetEase Online Matching)**:
            - 本地音乐库在播放本地音频时，若本地缺失内嵌封面或本地同名 .lrc 歌词，自动根据【歌手 + 歌名】从网易云音乐无缝检索获取高清封面与精准时间轴歌词（含翻译）。
            - 同步更新正在播放页面、底部控制栏、桌面歌词以及系统媒体通知。
          - **适配网易云/国内主流播放器四合一播放模式循环**:
            - 底部播放栏循环模式按钮：支持【列表循环 🔁】->【随机播放 🔀】->【单曲循环 🔂】->【顺序播放 🔁 (灰色)】一键循环切换。
            - 左右两个控制按钮（左侧随机按钮与右侧模式按钮）状态双向即时联动，开启随机时同步高亮，杜绝模式脱节。
          - **修复快速双击歌曲短暂播放又暂停问题**:
            - 双击已播放或加载中的曲目平滑保持播放，暂停状态平滑恢复播放，避免重复中断。
          - **歌单中歌名即时搜索 (Search in Playlist)**:
            - 歌单详情页与我喜欢的音乐右上方搜索框，实时按歌名、歌手过滤并支持直接播放。
          - **歌词字体大小调节 (Adjustable Lyrics Font Size)**:
            - 设置 -> 播放 中提供四档歌词字体缩放并持久化保存。

          ### 包含文件 (Files)
          - \`mygo-music-setup-0.1.25-amd64.exe\`: Windows 官方风格安装程序 (NSIS Installer)
          - \`MyGo.Music.exe\`: Windows 64位独立便携版 (绿色免安装)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "MyGo Music $TAG (Windows)" \
              --notes "$NOTES"
          fi

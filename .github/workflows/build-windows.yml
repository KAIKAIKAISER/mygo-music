name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.30"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          NOTES="### 修复与更新特性 (Bug Fixes & Features)
          - **桌面歌词窗口尺寸随歌词长度动态伸缩变换 (Dynamic Window Sizing & Auto Transformation)**:
            - 彻底移除固定 1024px/880px 僵硬边界；歌词短时窗口自动收敛紧凑（如 380px~520px），不遮挡多余屏幕空间。
            - 歌词较长时，窗口宽度根据文字实际像素尺寸自动平滑展开变宽，与歌词内容自适应融合。
          - **超出屏幕范围自动换行与高度自适应伸缩 (Auto-wrap & Dynamic Height on Screen Edge)**:
            - 取消单行截断（SingleLine）限制。当长歌词（如双语翻译）超出屏幕可视边界时，自动折行换行居中展示，彻底杜绝文字被屏幕物理边缘切断或丢字。
            - 窗口高度随换行行数动态自适应扩展，确保多行与翻译内容全部完整清晰展现。
          - **自由拖拽与智能平滑居中（告别死锁固定边界）**:
            - 彻底解决拖拽歌词时被强制锁死在屏幕边缘的问题，用户可随心所欲在桌面任意位置拖拽停放。
            - 歌词变换时长短伸缩以拖拽中心点对称展开，并智能确保左/右/顶/底边缘始终在显示器可视工作区内。
          - **彻底去除桌面歌词外部边框与圆角阴影 (True Borderless & Frameless Desktop Lyrics)**:
            - 彻底消除 Windows 11 DWM 系统默认添加的圆角外框与阴影边缘，实现纯粹透明无边框悬浮。
          - **桌面歌词全透明背景与锁定状态悬浮一键解锁 (Transparent Background & Hover Unlock)**:
            - 无论任何状态均保持 100% 透明无底色；锁定时鼠标移动到歌词区域浮现【🔓 解锁歌词】按钮直接点击解锁。
          - **本地音乐支持歌名与歌手搜索 + 自动匹配网易云高清封面和逐字歌词 (Local Music Search & NetEase Matching)**:
            - 本地音乐即时搜索过滤；播放本地歌曲缺失信息时自动检索网易云匹配。

          ### 包含文件 (Files)
          - \`mygo-music-setup-0.1.30-amd64.exe\`: Windows 官方风格安装程序 (NSIS Installer)
          - \`MyGo.Music.exe\`: Windows 64位独立便携版 (绿色免安装)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "MyGo Music $TAG (Windows)" \
              --notes "$NOTES"
          fi

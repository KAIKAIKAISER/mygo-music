name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.24"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          NOTES="### 修复与更新特性 (Bug Fixes & Features)
          - **适配网易云/国内主流播放器四合一播放模式循环**:
            - 深度重构底部播放控制栏右侧模式按钮：现已支持【列表循环 🔁】->【随机播放 🔀】->【单曲循环 🔂】->【顺序播放 🔁 (灰色)】一键循环切换，完全符合网易云音乐操作直觉。
            - 左右两个控制按钮（左侧随机按钮与右侧模式按钮）状态双向即时联动，开启随机时同步高亮，杜绝模式脱节。
            - 开启随机模式后自动关联全部循环，避免随机播完全部曲目后意外静止中断；列表循环到达末尾重新循环时自动重新洗牌，带来真正的无限随机体验。
            - 彻底解决点击循环模式按钮后无法生效随机播放的问题，配置与状态无缝持久化同步。
          - **修复快速双击歌曲短暂播放又暂停问题**:
            - 双击已播放或加载中的曲目平滑保持播放，暂停状态平滑恢复播放，避免重复中断。
          - **歌单中歌名即时搜索 (Search in Playlist)**:
            - 歌单详情页与我喜欢的音乐右上方搜索框，实时按歌名、歌手过滤并支持直接播放。
          - **歌词字体大小调节 (Adjustable Lyrics Font Size)**:
            - 设置 -> 播放 中提供四档歌词字体缩放并持久化保存。

          ### 包含文件 (Files)
          - \`mygo-music-setup-0.1.24-amd64.exe\`: Windows 官方风格安装程序 (NSIS Installer)
          - \`MyGo.Music.exe\`: Windows 64位独立便携版 (绿色免安装)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "MyGo Music $TAG (Windows)" \
              --notes "$NOTES"
          fi

name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.31"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          NOTES="### 新特性与更新内容 (New Features & Improvements)
          - **全新下载管理页面 (Full-featured Download Management Page)**:
            - 左侧边栏新增常驻【下载管理】导航入口，实时动态展示后台正在下载的任务数量徽标。
            - 拥有专属渐变质感头部卡片，统计已下载歌曲总数与本地磁盘空间占用（如 \`15 首歌曲 · 已占用 145.8 MB\`）。
            - 支持自定义下载目录：可随时点击【更改目录】选择任意本地文件夹，配置自动保存记忆；支持一键【打开目录】在系统资源管理器中浏览。
          - **双标签页分类管理 (Tabbed Views: Downloaded & Downloading)**:
            - **已下载 (X)**：收录全部已下载单曲，支持歌名/歌手即时关键词过滤搜索；支持一键【播放全部】与【随机播放】；悬浮歌曲行可一键【在文件夹中显示】快速定位高亮本地文件，支持一键删除与清空记录。
            - **正在下载 (Y)**：实时展示排队等待中与下载中的任务，动态呈现精致平滑的进度条、已下载字节数 / 总字节数与实时百分比；支持单个或全部取消，下载失败任务支持一键重试与清理。
          - **静默后台队列下载 (Seamless Background Queue Download)**:
            - 歌曲右键菜单点击【下载…】告别繁琐的另存为弹窗交互，直接静默入队下载。
            - 下载音频的同时自动获取并保存同名伴随歌词文件（\`.lrc\`），实现完整的离线歌词体验。
          - **原生完全脱网离线播放 (Offline Playback Support)**:
            - 下载完成的曲目支持在无网络环境下原生播放，直接读取本地音频流与本地 LRC 歌词，彻底免除在线依赖。

          ### 包含文件 (Files)
          - \`mygo-music-setup-0.1.31-amd64.exe\`: Windows 官方风格安装程序 (NSIS Installer)
          - \`MyGo.Music.exe\`: Windows 64位独立便携版 (绿色免安装)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "MyGo Music $TAG (Windows)" \
              --notes "$NOTES"
          fi

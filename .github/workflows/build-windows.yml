name: Build Windows EXE

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Create a GitHub Release'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows EXE
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install NSIS (for Windows installer packaging)
        run: sudo apt-get update && sudo apt-get install -y nsis

      - name: Build Windows Binary
        run: go tool mygo build -platform "windows/amd64"

      - name: List Build Output
        run: ls -la build/

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mygo-music-windows-amd64
          path: build/

      - name: Create or Update GitHub Release
        if: (github.event_name == 'workflow_dispatch' && inputs.create_release == true) || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF_NAME" == v* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v0.1.26"
          fi

          mkdir -p release_assets
          find build -type f -name "*.exe" -exec cp {} release_assets/ \;
          find build -type f -name "SHA256SUMS" -exec cp {} release_assets/ \;

          echo "Release assets prepared:"
          ls -la release_assets/

          NOTES="### 修复与更新特性 (Bug Fixes & Features)
          - **桌面歌词全透明背景 (Full Transparent Desktop Lyrics Background)**:
            - 彻底去除悬停时的半透明深色底框，桌面歌词在任何时候均保持 100% 全透明呈现。
            - 强化高对比度字体描边与外发光阴影，在浅色、深色或复杂壁纸与多窗口背景下皆清晰易读。
          - **桌面歌词锁定状态悬浮直接解锁 (Hover to Unlock in Locked State)**:
            - 处于锁定状态时，鼠标移动至桌面歌词区域上方，顶部将轻盈浮现【🔓 解锁歌词】控制按钮。
            - 鼠标悬停到解锁按钮时智能启用交互响应，直接点击即可一键解锁桌面歌词，无需切换回主窗口操作；鼠标移出后自动恢复 100% 鼠标完全穿透。
          - **本地音乐歌曲列表中支持歌名与歌手搜索 (Search in Local Music)**:
            - 本地音乐歌曲（Songs）、专辑（Albums）及歌手（Artists）列表顶部新增即时搜索过滤框。
            - 输入歌名或歌手名即可实时筛选本地曲目，且支持对筛选后的曲目直接点击【播放全部】或【随机播放】。
          - **本地音乐自动在线匹配网易云封面与歌词 (Local Music NetEase Online Matching)**:
            - 本地音乐库在播放本地音频时，若本地缺失内嵌封面或本地同名 .lrc 歌词，自动根据【歌手 + 歌名】从网易云音乐无缝检索获取高清封面与精准时间轴歌词（含翻译）。
            - 同步更新正在播放页面、底部控制栏、桌面歌词以及系统媒体通知。
          - **仿网易云风格桌面歌词与控制浮岛**:
            - 经典双行卡拉OK逐字高亮动画，提供 6 款主题配色（网易金/极光青/活力红/清新绿/梦幻粉/纯净白）及多款字号与字体轮换。
          - **适配网易云/国内主流播放器四合一播放模式循环**:
            - 底部播放栏循环模式按钮：支持【列表循环 🔁】->【随机播放 🔀】->【单曲循环 🔂】->【顺序播放 🔁 (灰色)】一键循环切换。
          - **修复快速双击歌曲短暂播放又暂停问题**:
            - 双击已播放或加载中的曲目平滑保持播放，暂停状态平滑恢复播放，避免重复中断。

          ### 包含文件 (Files)
          - \`mygo-music-setup-0.1.26-amd64.exe\`: Windows 官方风格安装程序 (NSIS Installer)
          - \`MyGo.Music.exe\`: Windows 64位独立便携版 (绿色免安装)"

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Updating existing release $TAG..."
            gh release upload "$TAG" release_assets/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" release_assets/* \
              --title "MyGo Music $TAG (Windows)" \
              --notes "$NOTES"
          fi
